services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: recordlife
      POSTGRES_PASSWORD: recordlife
      POSTGRES_DB: recordlife
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recordlife -d recordlife"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://recordlife:recordlife@db:5432/recordlife
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
